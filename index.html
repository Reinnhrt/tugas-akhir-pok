<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  CARA MENCARI BAGIAN YANG MAU DIUBAH:
  Tekan Ctrl+F (di HP: menu Cari) lalu ketik "UBAH" untuk melompat antar penanda.
  [UBAH-JUDUL]    judul tab browser
  [UBAH-WARNA]    semua warna (terang & gelap)
  [UBAH-UKURAN]   ukuran area, karakter, tulisan
  [UBAH-ANIMASI]  kecepatan naik, tinggi lompat, kecepatan jatuh
  [UBAH-GAMBAR]   gambar karakter, karakter lompat, bendera, latar, batu
  [UBAH-TEKS]     semua tulisan & ikon
  [UBAH-ATURAN]   jumlah nyawa, jeda, perilaku soal salah
  [UBAH-SOAL]     daftar soal & jawaban
  [UBAH-TANGGA]   tinggi & jarak batu
-->
<!-- [UBAH-JUDUL] -->
<title>Panjat Tangga Organisasi Komputer</title>
<style>
/* ===== [UBAH-WARNA] Mode terang ===== */
:root{--bg:#131313;--card:#8a5d5d;--text:#d3d3d3;--muted:#5d6f80;--btn:#e6edf5;--btnh:#d3e0ee;--ok:#2e9e5b;--bad:#d64545;--step:#8fa8c2;--sky:#cfe6fb;--acc:#2f6fb0;--acct:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* ===== [UBAH-WARNA] Mode gelap ===== */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#587529;--card:#EDDA5E;--text:#142101;--muted:#ffffff;--btn:#5B6E2C;--btnh:#314252;--step:#4b6178;--sky:#1d2f40;--acc:#5a9ee0;--acct:#0d1620}}
*{box-sizing:border-box}
html,body{margin:0;  font-weight: bold;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px;color:var(--muted)}
/* ===== [UBAH-UKURAN] Tinggi area tangga ===== */
.stage{position:relative;height: 320px;background:var(--sky);border-radius:16px;overflow:hidden;margin-bottom:12px}
/* Dunia yang bergeser (kamera). Semua batu, bendera & karakter ada di dalamnya */
#world{position:absolute;left:0;bottom:0;transition:transform .6s ease}
/* Batu mengapung mentahan (tanpa gambar): bagian bawah meruncing. Diganti otomatis bila GAMBAR.batu diisi */
.step{position:absolute;border-radius:14px 14px 50% 50%/14px 14px 85% 85%;
  background:linear-gradient(rgba(255,255,255,.22),rgba(0,0,0,.22)),var(--step);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
/* ===== [UBAH-ANIMASI] .6s = kecepatan naik ===== */
.char{position:absolute;width:0;display:flex;justify-content:center;white-space:nowrap;line-height:1;font-size:30px;transition:left .6s ease,bottom .6s ease,transform .9s ease}
/* Lompatan: gerak melengkung ke atas lalu turun. Tingginya dari variabel --lompat (diatur di JS) */
.char .body{display:block}
.char.jump .body{animation:lompat .6s ease-out}
@keyframes lompat{0%{transform:translateY(0)}50%{transform:translateY(calc(var(--lompat)*-1))}100%{transform:translateY(0)}}
/* ===== [UBAH-ANIMASI] .9s = kecepatan jatuh, 200deg = putaran saat jatuh ===== */
.char.fall{transition:left .3s,bottom .9s cubic-bezier(.5,0,1,1),transform .9s;transform:rotate(200deg)}
.flag{position:absolute;font-size:24px;line-height:1}
.char img,.flag img{display:block}
.card{background:var(--card);border-radius:16px;padding:16px}
/* ===== [UBAH-UKURAN] Tulisan soal & tombol jawaban ===== */
.q{font-size:18px;line-height:1.45;margin:0 0 12px}
.opt{display:block;width:100%;font:inherit;font-size:16px;text-align:left;padding:13px;margin-bottom:8px;border:0;border-radius:12px;background:var(--btn);color:var(--text);cursor:pointer}
.opt:active{background:var(--btnh)}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.main{background:var(--acc);color:var(--acct);text-align:center;font-weight:600}
.res{text-align:center}.res h2{margin:6px 0}.res p{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span id="lives"></span><span id="prog"></span></div>
  <div class="stage" id="stage"></div>
  <div class="card" id="card"></div>
</div>
<script>
// ===== [UBAH-GAMBAR] =====
// Isi dengan nama file (mis. "karakter.png", satu folder dengan HTML).
// Kosongkan ("") untuk memakai gambar/emoji mentahan bawaan.
var GAMBAR={
  karakter:"karakter 1 fix.png",        // karakter saat berdiri (mis. "karakter.png")
  karakterLompat:"karakter lompat fix.png",  // karakter saat melompat (mis. "karakter-lompat.png")
  bendera:"bendera 1.png",         // gambar di puncak
  latar:"latar 2.jpg",           // latar belakang area
  batu:"batu 5 fix.png",            // gambar batu mengapung (mis. "batu.png")
  fondasi:""          // gambar batu pertama tempat mulai berdiri; kosong = pakai gambar batu
};
// [UBAH-GAMBAR] emoji mentahan & ukuran (piksel) karakter dan bendera
var EMOJI_KARAKTER="🧗", EMOJI_LOMPAT="🤸", TINGGI_KARAKTER=60;
var EMOJI_BENDERA="🚩",  TINGGI_BENDERA=28;

// ===== [UBAH-TEKS] semua tulisan & ikon =====
var TEKS={
  nyawa:"Kesempatan: ",
  ikonNyawaPenuh:"❤️",
  ikonNyawaKosong:"🖤",
  tangga:"Batu ke-",
  ikonMenang:"🏆",
  judulMenang:"Kamu mencapai puncak!",
  isiMenang:"Semua materi berhasil dijawab. Hebat!",
  ikonKalah:"💀",
  judulKalah:"Kamu terjatuh!",
  isiKalah:"Kesempatan habis di batu ke-",
  isiKalah2:". Ayo coba lagi!",
  tombolUlang:"Main lagi"
};

// ===== [UBAH-ATURAN] =====
var MAXLIFE=3;        // jumlah kesempatan salah
var JEDA=1100;        // jeda (milidetik) sebelum soal berikutnya
var ULANG_SOAL_SALAH=true;  // true = soal salah diulang di akhir; false = dilewati

// ===== [UBAH-ANIMASI] =====
var DURASI_LOMPAT=600;  // milidetik; samakan dengan .6s di CSS .char
var TINGGI_LOMPAT=30;   // seberapa tinggi karakter melambung (piksel)

// ===== [UBAH-TANGGA] ukuran (piksel) & jarak batu =====
var BATU_W=96, BATU_H=56;        // ukuran batu biasa
var FONDASI_W=100, FONDASI_H=56; // ukuran batu pertama (fondasi tempat mulai)
var JARAK_X=96;   // jarak mendatar antar batu (makin besar makin berjarak)
var JARAK_Y=44;   // beda tinggi antar batu
var BASE_Y=60;    // tinggi permukaan fondasi dari dasar layar
// Penyesuaian posisi (piksel) bila gambar punya ruang transparan di tepinya:
var KAKI_TURUN=9; // karakter melayang di atas batu -> isi angka positif (mis. 6) untuk menurunkan
var BATU_NAIK=9;  // gambar batu punya ruang kosong di atasnya -> isi angka positif untuk menaikkan batu
// Kamera: kalau batu berikutnya tidak muat di layar, tampilan bergeser mengikuti karakter.
var KAMERA_X=0.3; // posisi karakter dari kiri layar (0-1)
var KAMERA_Y=0.4; // batas tinggi karakter dari bawah layar (0-1)

// ===== [UBAH-SOAL] =====
// q = pertanyaan, o = pilihan. Pilihan PERTAMA adalah jawaban benar (diacak saat tampil).
var BANK=[
{q:"Komponen yang berfungsi mengeksekusi instruksi program adalah…",o:["CPU (Prosesor)","RAM","Harddisk","Monitor"]},
{q:"Satuan data terkecil dalam komputer adalah…",o:["Bit","Byte","Word","Kilobyte"]},
{q:"1 byte sama dengan berapa bit?",o:["8","4","16","32"]},
{q:"Memori yang isinya hilang saat listrik padam (volatile) adalah…",o:["RAM","ROM","SSD","Harddisk"]},
{q:"Bagian CPU yang melakukan operasi aritmatika dan logika adalah…",o:["ALU","Control Unit","Register","Cache"]},
{q:"Bagian CPU yang mengatur dan mengendalikan eksekusi instruksi adalah…",o:["Control Unit","ALU","Address Bus","Monitor"]},
{q:"Arsitektur yang memakai satu memori yang sama untuk instruksi dan data disebut…",o:["Von Neumann","Harvard","Pipeline","Superskalar"]},
{q:"Siklus dasar eksekusi instruksi adalah…",o:["Fetch – Decode – Execute","Load – Store – Halt","Input – Process – Output","Boot – Run – Shutdown"]},
{q:"Register yang menyimpan alamat instruksi berikutnya adalah…",o:["Program Counter","Accumulator","Stack Pointer","Flag Register"]},
{q:"Memori tercepat dalam hierarki memori adalah…",o:["Register","Cache","RAM","Harddisk"]},
{q:"Jalur yang membawa alamat lokasi memori adalah…",o:["Address Bus","Data Bus","Control Bus","Power Bus"]},
{q:"Bilangan biner 1010 bernilai desimal…",o:["10","8","12","5"]},
{q:"Sistem bilangan heksadesimal memiliki basis…",o:["16","8","10","2"]},
{q:"Cache L1 umumnya terletak…",o:["Di dalam prosesor, dekat inti CPU","Di dalam harddisk","Di dalam power supply","Di dalam monitor"]},
{q:"Perangkat berikut yang termasuk perangkat output adalah…",o:["Monitor","Keyboard","Mouse","Scanner"]}
];

// ===== KODE PROGRAM (biasanya tidak perlu diubah) =====
var N=BANK.length, st, locked, X0=50;
var stage=document.getElementById("stage"), card=document.getElementById("card");

function isi(el,src,emoji,tinggi){
  if(src){el.innerHTML='<img src="'+src+'" alt="" style="height:'+tinggi+'px">'}
  else{el.textContent=emoji}
}
function sprite(lompat){
  var b=document.getElementById("charBody");
  if(lompat)isi(b,GAMBAR.karakterLompat||GAMBAR.karakter,EMOJI_LOMPAT,TINGGI_KARAKTER);
  else isi(b,GAMBAR.karakter,EMOJI_KARAKTER,TINGGI_KARAKTER);
}
function px(i){return X0+i*JARAK_X}
function py(i){return BASE_Y+i*JARAK_Y}
function cam(p){
  var w=document.getElementById("world"),W=stage.clientWidth,H=stage.clientHeight;
  var tx=-Math.max(0,px(p)-W*KAMERA_X), dy=Math.max(0,py(p)-H*KAMERA_Y);
  w.style.transform="translate("+tx+"px,"+dy+"px)";
  return dy;
}
function buildStage(){
  stage.innerHTML="";
  stage.style.background=GAMBAR.latar?"url('"+GAMBAR.latar+"') center/cover":"";
  var w=document.createElement("div");w.id="world";stage.appendChild(w);
  for(var i=0;i<=N;i++){
    var aw=i===0, lebar=aw?FONDASI_W:BATU_W, tinggi=aw?FONDASI_H:BATU_H, img=aw?(GAMBAR.fondasi||GAMBAR.batu):GAMBAR.batu;
    var s=document.createElement("div");s.className="step";
    s.style.left=(px(i)-lebar/2)+"px";s.style.bottom=(py(i)-tinggi+BATU_NAIK)+"px";
    s.style.width=lebar+"px";s.style.height=tinggi+"px";
    if(img){s.style.background="url('"+img+"') center/100% 100% no-repeat";s.style.boxShadow="none";s.style.borderRadius="0"}
    w.appendChild(s);
  }
  var f=document.createElement("div");f.className="flag";isi(f,GAMBAR.bendera,EMOJI_BENDERA,TINGGI_BENDERA);
  f.style.left=(px(N)+12)+"px";f.style.bottom=py(N)+"px";w.appendChild(f);
  var c=document.createElement("div");c.className="char";c.id="char";
  c.style.setProperty("--lompat",TINGGI_LOMPAT+"px");
  c.innerHTML='<span class="body" id="charBody"></span>';w.appendChild(c);
  sprite(false);
  w.style.transition="none";place(0,false);void w.offsetWidth;w.style.transition="";
}
function place(p,lompat){
  var c=document.getElementById("char");
  c.style.left=px(p)+"px";
  c.style.bottom=(py(p)-KAKI_TURUN)+"px";
  cam(p);
  if(lompat){
    sprite(true);c.classList.remove("jump");void c.offsetWidth;c.classList.add("jump");
    setTimeout(function(){c.classList.remove("jump");if(!c.classList.contains("fall"))sprite(false)},DURASI_LOMPAT);
  }
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){
  st={p:0,life:MAXLIFE,queue:shuffle(BANK.map(function(_,i){return i}))};
  buildStage();ask();
}
function hud(){
  document.getElementById("lives").textContent=TEKS.nyawa+TEKS.ikonNyawaPenuh.repeat(st.life)+TEKS.ikonNyawaKosong.repeat(MAXLIFE-st.life);
  document.getElementById("prog").textContent=TEKS.tangga+st.p+"/"+N;
}
function ask(){
  hud();locked=false;
  var qi=st.queue[0],it=BANK[qi],correct=it.o[0];
  card.innerHTML="";
  var q=document.createElement("p");q.className="q";q.textContent=it.q;card.appendChild(q);
  shuffle(it.o).forEach(function(t){
    var b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=function(){answer(b,t===correct,correct)};card.appendChild(b);
  });
}
function answer(b,ok,correct){
  if(locked)return;locked=true;
  var btns=card.querySelectorAll(".opt");
  if(ok){
    b.classList.add("ok");st.queue.shift();st.p++;place(st.p,true);
  }else{
    b.classList.add("bad");
    btns.forEach(function(x){if(x.textContent===correct)x.classList.add("ok")});
    st.life--;
    if(ULANG_SOAL_SALAH){st.queue.push(st.queue.shift())}else{st.queue.shift()}
  }
  hud();
  setTimeout(function(){
    if(st.p>=N)return end(true);
    if(st.life<=0||st.queue.length===0)return end(false);
    ask();
  },JEDA);
}
function end(win){
  hud();
  var c=document.getElementById("char");
  if(!win){c.classList.add("fall");c.style.bottom=(cam(st.p)-120)+"px"}
  setTimeout(function(){
    card.innerHTML='<div class="res"><div style="font-size:54px">'+(win?TEKS.ikonMenang:TEKS.ikonKalah)+'</div><h2>'+
      (win?TEKS.judulMenang:TEKS.judulKalah)+'</h2><p>'+
      (win?TEKS.isiMenang:TEKS.isiKalah+st.p+TEKS.isiKalah2)+
      '</p></div>';
    var b=document.createElement("button");b.className="opt main";b.textContent=TEKS.tombolUlang;b.onclick=start;card.appendChild(b);
  },win?600:1000);
}
window.addEventListener("resize",function(){if(st)cam(st.p)});
start();
</script>
</body>
</html>
